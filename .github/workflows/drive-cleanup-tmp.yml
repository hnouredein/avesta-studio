name: Drive cleanup (one-off)
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete debug folders job17 and job18 only
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -e
          curl -fsSL https://rclone.org/install.sh | sudo bash
          printf '%s' "$RCLONE_CONF" > /tmp/rclone.conf
          chmod 600 /tmp/rclone.conf
          R="--config /tmp/rclone.conf"
          echo "before:"; rclone $R lsd drive:avesta
          for d in 2026-11-24-job17 2026-11-24-job18; do
            if rclone $R lsf "drive:avesta/$d" >/dev/null 2>&1; then rclone $R purge "drive:avesta/$d" && echo "deleted $d"; else echo "$d not found"; fi
          done
          echo "after:"; rclone $R lsd drive:avesta
          shred -u /tmp/rclone.conf

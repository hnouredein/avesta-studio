name: Auto mode
on:
  # schedule trigger disabled: unattended auto-dispatch removed (manual dispatch only)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: auto-mode
  cancel-in-progress: false
jobs:
  auto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dispatch next queued video
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/auto_dispatch.py
      - name: Save queue
        run: |
          if ! git diff --quiet studio/queue.json; then
            git config user.name "studio-auto"; git config user.email "auto@users.noreply.github.com"
            git add studio/queue.json; git commit -qm "auto: queue advanced"
            git pull -q --rebase origin main && git push -q origin HEAD:main
          fi

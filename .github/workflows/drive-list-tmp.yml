name: Drive list (read-only, one-off)
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List drive:avesta (read only)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          printf '%s' "$RCLONE_CONF" > /tmp/rclone.conf
          chmod 600 /tmp/rclone.conf
          echo "LISTING:"; rclone --config /tmp/rclone.conf lsl drive:avesta --max-depth 2
          shred -u /tmp/rclone.conf
